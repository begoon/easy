name: publish

# Publishes @begoon/easyc to npm when a v* tag is pushed (see `just release`).
# Uses npm trusted publishing: GitHub's OIDC token authenticates the publish,
# so there is no npm token in the repository or on any machine. npm attaches
# provenance automatically. The trusted publisher on npmjs.com must name
# this file, publish.yml, exactly.

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    id-token: write

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
            # Trusted publishing needs npm 11.5.1 or later.
            - run: npm install -g npm@11
            - name: Check the tag matches package.json
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
                      exit 1
                  fi
            # prepublishOnly runs the compile-only tests and builds dist/easyc.js.
            # --access public: scoped packages default to private.
            - run: npm publish --access public
